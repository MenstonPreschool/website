# Menston Preschool website. Built by GitHub Pages (Jekyll). See README.md for how to edit.
title: Menston Preschool
description: Menston Preschool is a charity-run, Ofsted Outstanding preschool in the heart of Menston, West Yorkshire.
lang: en-GB
markdown: kramdown
# Leave empty on a custom domain or when served from the site root.
baseurl: ""
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - tools

# GitHub Pages turns relative Markdown links into root-absolute ones, which breaks
# links when the site is served from a sub-path. Keep links as written.
relative_links:
  enabled: false
